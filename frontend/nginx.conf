server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Keep the original Host (with port) so the backend's CSRF origin check compares correctly.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $request_id;

    # Message attachments/raw mail can be large; the backend enforces the real limits.
    client_max_body_size 1m;

    # API (JSON, downloads, long-poll wait-for-email and the SSE stream). The backend sets its own
    # security headers (CSP, nosniff, ...) so none are added here.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # required for Server-Sent Events
        proxy_read_timeout 300s;      # wait-for-email can hold a request for up to MAX_WAIT_TIMEOUT_MS
    }

    # Static single-page app.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # frame-src 'self' lets the viewer embed /api/messages/:id/html, which carries its own sandbox + CSP.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached forever. (add_header in a location replaces the parent set, so repeat.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
